[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "q1k"
version = "0.1.0"
description = "Preprocessing pipeline for EEG/eye-tracking data from the Quebec 1000 Families project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Christian O'Reilly", email = "christian.oreilly@sc.edu" },
    { name = "James Desjardins", email = "jim.a.desjardins@gmail.com" },
]

dependencies = [
    "mne>=1.0",
    "mne-bids>=0.12",
    "pylossless",
    "autoreject",
    "eyelinkio",
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "marimo",
    "tqdm",
    "python-docx",
    "openpyxl",
    "kaleido",
]

[project.optional-dependencies]
analyses = [
    "xarray",
    "dask",
    "seaborn",
    "scipy",
    "pybids",
]
test = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
]
doc = [
    "numpydoc",
    "shibuya",
    "sphinx>=6",
    "sphinx-copybutton",
    "sphinx-design",
]
dev = [
    "build",
    "codespell",
    "coverage[toml]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/lina-usc/q1k"
Documentation = "https://q1k.readthedocs.io/"
Repository = "https://github.com/lina-usc/q1k"
Issues = "https://github.com/lina-usc/q1k/issues"

[project.scripts]
q1k-init = "q1k.init.cli:main"
q1k-pylossless = "q1k.pylossless.cli:main"
q1k-sync-loss = "q1k.sync_loss.cli:main"
q1k-segment = "q1k.segment.cli:main"
q1k-autorej = "q1k.autorej.cli:main"
q1k-tracking = "q1k.tracking.cli:main"

[tool.setuptools.packages.find]
include = ["q1k*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
q1k = [
    "pylossless/config.yaml",
    "slurm/*.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore:.*pkg_resources.*:DeprecationWarning",
    "ignore:.*distutils.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "q1k/notebooks",
    "grands",
    "q1k_dashboard",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

[tool.codespell]
skip = "*.ipynb,*.html,*.css,*.egg-info,.git,.ruff_cache,docs/_build"
ignore-words-list = "autorej,pylossless,ndd"

[tool.coverage.run]
branch = true
source = ["q1k"]
omit = [
    "tests/*",
    "grands/*",
    "q1k/analyses/*",
    "q1k/init/*",
    "q1k/notebooks/*",
    "q1k/pylossless/*",
    "q1k/sync_loss/*",
    "q1k/*/x*.py",
    "q1k/*/xtest_*.py",
    "q1k/autorej/pipeline.py",
    "q1k/q1k_manager.py",
    "q1k/xq1k_manager.py",
    "q1k_dashboard/*",
]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
