name: Style, Spellcheck, and Pre-commit

on:
  push:
    branches:
      - main
      - syneqxis
  pull_request:
    branches:
      - main
      - syneqxis

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run pre-commit hooks
        run: pre-commit run --all-files
      - name: Run Ruff
        run: >-
          ruff check
          q1k/bids.py
          q1k/config.py
          q1k/io.py
          q1k/slurm.py
          q1k/autorej
          q1k/segment/tasks.py
          q1k/tracking
          tests
      - name: Run Codespell
        run: >-
          codespell
          q1k/bids.py
          q1k/config.py
          q1k/io.py
          q1k/slurm.py
          q1k/autorej
          q1k/segment/tasks.py
          q1k/tracking
          tests
          docs
          README.md
